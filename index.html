<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paisa Tracker</title>
<style>
:root{--bg:#eef3f2;--cd:#fff;--tx:#10201f;--mu:#62706f;--ac:#0f766e;--ac2:#d9efec;--ok:#15803d;--wa:#b45309;--er:#dc2626;--bd:#d9e2e1;--hero:#0f3d3a;--herotx:#e8fbf7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1514;--cd:#132220;--tx:#e6f2f0;--mu:#8fa5a2;--ac:#2dd4bf;--ac2:#173a36;--ok:#4ade80;--wa:#fbbf24;--er:#f87171;--bd:#223735;--hero:#0f3d3a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1514;--cd:#132220;--tx:#e6f2f0;--mu:#8fa5a2;--ac:#2dd4bf;--ac2:#173a36;--ok:#4ade80;--wa:#fbbf24;--er:#f87171;--bd:#223735;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:14px}
h2{font-size:19px;margin:6px 0 12px}
small,.mu{color:var(--mu);font-size:12.5px}
.hero{background:var(--hero);color:var(--herotx);border-radius:22px;padding:20px;margin-bottom:12px}
.hero small{color:#9ccfc8}
.hero .big{font-size:46px;font-weight:800;letter-spacing:-1.5px;line-height:1.05;margin:2px 0 4px}
.hero .row{display:flex;gap:20px;margin-top:14px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar{height:9px;border-radius:9px;background:var(--bd);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;border-radius:9px}
.al{padding:10px 12px;border-radius:12px;margin-bottom:8px;font-size:14px;border-left:5px solid}
.al.er{background:color-mix(in srgb,var(--er) 14%,var(--cd));border-color:var(--er)}
.al.wa{background:color-mix(in srgb,var(--wa) 14%,var(--cd));border-color:var(--wa)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.g3 div{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:10px}
.g3 b{display:block;font-size:17px}
.it{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--bd)}
.it:first-child{border-top:0}
.it .ic{width:38px;height:38px;border-radius:12px;background:var(--ac2);display:grid;place-items:center;font-size:19px;flex:none}
.fl{flex:1;min-width:0}.fl b,.fl small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{border:0;background:var(--ac2);color:var(--tx);border-radius:9px;min-width:34px;height:34px;font-size:14px;cursor:pointer}
button{font:inherit;color:inherit}
.seg{display:flex;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:4px;margin-bottom:12px;gap:4px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:10px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--ac);color:#fff}
:root[data-theme="dark"] .seg button.on{color:#06201d}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button.on,:root:not([data-theme="light"]) .pri{color:#06201d}}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 14px}
.mb{border:1.5px solid var(--bd);background:var(--cd);border-radius:14px;padding:12px 4px;text-align:center;cursor:pointer;font-size:13px}
.mb span{display:block;font-size:24px}
.mb.on{border-color:var(--ac);background:var(--ac2);font-weight:700}
label{display:block;font-weight:600;font-size:13px;margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1.5px solid var(--bd);border-radius:12px;padding:11px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
#amt{font-size:30px;font-weight:800;padding:12px}
.pri{width:100%;border:0;background:var(--ac);color:#fff;font-weight:700;font-size:16px;padding:14px;border-radius:14px;margin-top:14px;cursor:pointer}
.sec{border:1.5px solid var(--bd);background:none;border-radius:12px;padding:9px 12px;cursor:pointer;font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{border:1.5px solid var(--bd);background:var(--cd);border-radius:20px;padding:6px 13px;cursor:pointer}.chips .on{border-color:var(--ac);background:var(--ac2);font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;padding:8px 0 7px;font-size:10.5px;color:var(--mu);cursor:pointer}
nav button span{display:block;font-size:20px}nav button.on{color:var(--ac);font-weight:700}
#toast{position:fixed;left:14px;right:14px;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:532px;margin:auto;background:#10201f;color:#fff;padding:12px 14px;border-radius:12px;z-index:9;display:none}
.donut{width:130px;height:130px;border-radius:50%;flex:none;display:grid;place-items:center}
.donut i{width:78px;height:78px;border-radius:50%;background:var(--cd);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px}
.dots{display:flex;gap:6px;align-items:flex-end;height:90px;overflow-x:auto;padding-top:4px}
.dots div{flex:1;min-width:7px;background:var(--ac);border-radius:4px 4px 0 0}
.lg{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.bb{max-width:88%;padding:9px 12px;border-radius:14px;margin:6px 0;font-size:14.5px;line-height:1.45}.bb.u{background:var(--ac2);border:1.5px solid var(--ac);margin-left:auto}.bb.b{background:var(--cd);border:1px solid var(--bd)}#cl{min-height:200px}
#fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--ac);font-size:25px;z-index:6;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer}#fab.on{background:var(--er);animation:pl 1s infinite}@keyframes pl{50%{transform:scale(1.12)}}
</style></head><body>
<main><div id="v"></div></main><div id="toast"></div>
<button id="fab" onclick="mic2()" aria-label="Log by voice">🎤</button>
<nav id="nav"></nav>
<script>
const CATS={'Quick Commerce':'#f59e0b','Shopping':'#6366f1','Food (College)':'#10b981','Food (Outside)':'#ef4444','Travel':'#06b6d4','Other':'#a855f7'};
const KW={blinkit:'Blinkit',zepto:'Zepto',swiggy:'Swiggy/Zomato',zomato:'Swiggy/Zomato',amazon:'Amazon',flipkart:'Flipkart',canteen:'Canteen',mess:'Mess',uber:'Travel',ola:'Travel',rapido:'Travel',irctc:'Travel'};
const DEF={inc:[],exp:[],sav:[],mer:[{n:'Blinkit',c:'Quick Commerce',i:'⚡'},{n:'Zepto',c:'Quick Commerce',i:'🛵'},{n:'Swiggy/Zomato',c:'Food (Outside)',i:'🍔'},{n:'Amazon',c:'Shopping',i:'📦'},{n:'Flipkart',c:'Shopping',i:'🛍️'},{n:'Canteen',c:'Food (College)',i:'🍛'},{n:'Mess',c:'Food (College)',i:'🍽️'},{n:'Travel',c:'Travel',i:'🚌'},{n:'Other',c:'Other',i:'💸'}],lim:{'Quick Commerce':500,'Shopping':1500},goal:{name:'',target:0},next:'',pct:20,bud:7500,day:200};
let S;try{S=JSON.parse(localStorage.getItem('paisa1'))}catch(e){}
S=Object.assign({},DEF,S||{});
const save=()=>{try{localStorage.setItem('paisa1',JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const T=()=>ymd(new Date),pd=s=>new Date(s+'T00:00');
const ad=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const df=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
const inr=n=>(n<0?'-':'')+'₹'+Math.round(Math.abs(n)).toLocaleString('en-IN');
const sm=a=>a.reduce((s,x)=>s+x.amt,0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const btw=(a,f,t)=>a.filter(x=>x.date>=f&&x.date<=t);
const wk=()=>{const f=ad(T(),-((pd(T()).getDay()+6)%7));return[f,ad(f,6)]};
const mo=()=>T().slice(0,7);
const mer=n=>S.mer.find(m=>m.n===n)||{n,c:'Other',i:'💸'};
const grp=(a,f)=>{const o={};a.forEach(x=>o[f(x)]=(o[f(x)]||0)+x.amt);return Object.entries(o).sort((a,b)=>b[1]-a[1])};
const col=p=>p>=1?'var(--er)':p>=.8?'var(--wa)':'var(--ok)';
const bar=(p,c)=>`<div class="bar"><i style="width:${Math.min(100,p*100)}%;background:${c||col(p)}"></i></div>`;
if(!S.next)S.next=ad(T(),15);
if(!S.bud75){S.bud=7500;S.bud75=1;save()}
if(!S.day200){S.day=200;S.day200=1;save()}
let tab='home',pend=null,F=nf(),RV={sub:'d',date:T(),month:mo()};
function nf(){return{mode:'exp',m:'',amt:'',date:T(),note:'',pct:S.bud?0:S.pct,nx:S.next,ed:null}}

function K(){const k=K1();if(S.day>0)k.budget=S.day;return k}
function K1(){const k=K0(),b=S.bud;k.ms=sm(k.mx);k.tot=(S.open||0)+sm(S.inc)-sm(S.exp);if(!b){k.saved=sm(S.sav);return k}
const t=k.t,tot=(S.open||0)+sm(S.inc)-sm(S.exp),dm=new Date(+t.slice(0,4),+t.slice(5,7),0).getDate(),dl=dm-(+t.slice(8))+1;
k.dl=dl;k.bal=Math.max(0,Math.min(tot,b-k.ms));k.saved=Math.max(0,tot-k.bal);const pool=Math.max(0,Math.min(tot+k.td,b-(k.ms-k.td)));k.budget=pool/dl;k.run=k.avg>0?k.bal/k.avg:Infinity;return k}
function K0(){const t=T(),bal=sm(S.inc)-sm(S.exp)-sm(S.sav),dl=Math.max(1,df(S.next,t)),td=sm(S.exp.filter(e=>e.date===t)),budget=Math.max(0,bal+td)/dl,[w1,w2]=wk(),wkx=btw(S.exp,w1,w2),mx=S.exp.filter(e=>e.date.slice(0,7)===mo()),avg=sm(btw(S.exp,ad(t,-6),t))/7;return{t,bal,dl,td,budget,wkx,mx,avg,run:avg>0?bal/avg:Infinity}}
function AL(k){const a=[];
if(k.td>k.budget)a.push(['er',`Today’s spend of ${inr(k.td)} is over your safe limit of ${inr(k.budget)}.`]);else if(k.budget>0&&k.td/k.budget>=.8)a.push(['wa',`You’ve used ${Math.round(k.td/k.budget*100)}% of today’s safe limit.`]);
for(const c in S.lim){const L=S.lim[c];if(L>0){const s=sm(k.wkx.filter(e=>mer(e.m).c===c)),p=s/L;if(p>=1)a.push(['er',`${c} weekly limit crossed: ${inr(s)} of ${inr(L)}.`]);else if(p>=.8)a.push(['wa',`${c} is at ${Math.round(p*100)}% of its weekly limit.`])}}
if(isFinite(k.run)&&k.run<k.dl)a.push(['wa',`At your recent pace your money lasts about ${Math.floor(k.run)} days, but you need it for ${k.dl} more days${S.bud?' this month':''}.`]);
if(S.bud){const p=k.ms/S.bud;if(p>=1)a.push(['er',`You’ve crossed your ${inr(S.bud)} monthly budget.`]);else if(p>=.8)a.push(['wa',`${Math.round(p*100)}% of your monthly budget is used.`])}
if(k.bal<0)a.push(['er',`Your balance is negative (${inr(k.bal)}). Check your entries.`]);return a}
function IN(k){const r=[],tot=sm(k.mx);
if(tot>0){const g=grp(k.mx,e=>e.m)[0];r.push(`You spent ${inr(g[1])} on ${esc(g[0])} this month, ${Math.round(g[1]/tot*100)}% of your total.`);
const w=sm(k.mx.filter(e=>['Quick Commerce','Shopping'].includes(mer(e.m).c)));if(w>0)r.push(`Quick commerce and shopping took ${inr(w)} (${Math.round(w/tot*100)}%) this month. These are the easiest to cut.`)}
if(isFinite(k.run))r.push(`At this rate your money will last about ${Math.floor(k.run)} days.`);
const sv=sm(S.sav.filter(x=>x.date.slice(0,7)===mo()&&x.amt>0));r.push(S.bud?`You’ve saved ${inr(k.tot)} in total. Stay under ${inr(S.bud)} this month and the rest stays saved.`:sv>0?`You saved ${inr(sv)} this month.`:`Nothing saved this month yet. Move a share when money arrives.`);return r}
const er=e=>{const m=mer(e.m);return`<div class="it"><span class="ic">${m.i}</span><div class="fl"><b>${esc(e.m)}</b><small>${e.date}${e.note?' · '+esc(e.note):''}</small></div><b>${inr(e.amt)}</b><button class="ib" onclick="ee('${e.id}')">✎</button><button class="ib" onclick="del('e','${e.id}')">${pend==='e'+e.id?'Sure?':'×'}</button></div>`};
const ir=e=>`<div class="it"><span class="ic">💰</span><div class="fl"><b>${esc(e.note||'Money in')}</b><small>${e.date}</small></div><b style="color:var(--ok)">+${inr(e.amt)}</b><button class="ib" onclick="ei('${e.id}')">✎</button><button class="ib" onclick="del('i','${e.id}')">${pend==='i'+e.id?'Sure?':'×'}</button></div>`;
const rows=(g,tot)=>g.map(([n,v])=>`<div style="margin-top:8px"><div class="row"><span>${mer(n).i||''} ${esc(n)}</span><b>${inr(v)}</b></div>${bar(v/tot,CATS[mer(n).c]||CATS[n]||'var(--ac)')}</div>`).join('');

const V={
chat(){if(!CH.length)say('b',greet());return`<h2>Chat</h2><div id="cl">${CH.slice(-30).map(m=>`<div class="bb ${m.w}">${esc(m.t).replace(/\n/g,'<br>')}</div>`).join('')}</div><div class="chips" style="margin-top:10px">${['Balance','Today','This week','This month','Undo'].map(c=>`<button onclick="chatSend('${c}')">${c}</button>`).join('')}</div><div class="row" style="margin-top:10px"><button class="ib" style="height:46px;min-width:46px" onclick="mic2()">🎤</button><input id="cm" placeholder="Spent 250 on Blinkit…" onkeydown="if(event.key==='Enter')chatSend()"><button class="pri" style="width:auto;margin:0;padding:12px 16px" onclick="chatSend()">Send</button></div>`},
home(){const k=K(),a=AL(k),p=k.budget?k.td/k.budget:(k.td?2:0),sv=sm(S.sav.filter(x=>x.date.slice(0,7)===mo()&&x.amt>0)),te=S.exp.filter(e=>e.date===k.t);
return`<div class="hero"><small>Safe to spend today</small><div class="big">${inr(Math.max(0,k.budget-k.td))}</div><small>of ${inr(k.budget)} for today · ${S.inc.length||S.exp.length?'':'add your first money in to start'}</small>
<div class="row"><div><small>${S.bud?'Actual balance':'Spendable balance'}</small><br><b style="font-size:20px">${inr(S.bud?k.tot:k.bal)}</b></div><div style="text-align:right"><small>${S.bud?'Days left in month':'Next money in'}</small><br><b style="font-size:20px">${k.dl} day${k.dl>1?'s':''}</b></div></div></div>
<div class="cd"><div class="row"><div><b>Bank balance</b><br><small>Type what your bank or GPay shows now</small></div><input type="number" inputmode="numeric" placeholder="₹ now" value="${Math.round(k.tot)}" style="width:130px;text-align:center;font-weight:700" onchange="setBal(this.value)"></div></div>
<div class="cd"><div class="row"><b>Today</b><span>${inr(k.td)} / ${inr(k.budget)}</span></div>${bar(p)}<div class="row"><small>Safe to spend today (₹)</small><div class="row"><button class="ib" onclick="S.day=Math.max(0,(S.day||0)-50);save();R()">−50</button><input type="number" inputmode="numeric" placeholder="Auto" value="${S.day||''}" style="width:90px;text-align:center;font-weight:700" onchange="S.day=+this.value||0;save();R()"><button class="ib" onclick="S.day=(S.day||0)+50;save();R()">+50</button></div></div></div>
${a.map(x=>`<div class="al ${x[0]}">${x[1]}</div>`).join('')}
${S.bud?`<div class="cd"><div class="row"><b>Monthly spending limit</b><span>${inr(k.ms)} / ${inr(S.bud)}</span></div>${bar(k.ms/S.bud)}<small>Limit left this month: ${inr(Math.max(0,S.bud-k.ms))}. Your actual balance is ${inr(k.tot)}.</small><div class="row" style="margin-top:10px"><button class="ib" onclick="S.bud=Math.max(0,S.bud-500);save();R()">−500</button><input type="number" inputmode="numeric" value="${S.bud}" style="text-align:center;font-weight:700" onchange="S.bud=+this.value||0;save();R()"><button class="ib" onclick="S.bud+=500;save();R()">+500</button></div></div>`:''}
<div class="g3"><div><small>Today</small><b>${inr(k.td)}</b></div><div><small>This week</small><b>${inr(sm(k.wkx))}</b></div><div><small>This month</small><b>${inr(sm(k.mx))}</b></div></div>
<div class="cd row"><span>Anything to log today?</span><button class="sec" onclick="go('chat')">💬 Tell the bot</button></div>
<div class="cd"><b>Insights</b>${IN(k).map(x=>`<p style="margin:8px 0 0">${x}</p>`).join('')}</div>
<div class="cd"><div class="row"><b>Today’s entries</b><small>Saved so far: ${inr(sm(S.sav))}</small></div>${te.length?te.map(er).join(''):'<p class="mu">Nothing logged today. Tap Add and log each spend right away.</p>'}</div>`},

add(){const ex=F.mode==='exp',a=parseFloat(F.amt)||0;
return`<div class="seg"><button class="${ex?'on':''}" onclick="fm('exp')">Expense</button><button class="${ex?'':'on'}" onclick="fm('inc')">Money in</button></div><div class="cd">
${F.ed?'<div class="al wa">Editing an entry</div>':''}
${ex?`<label>Where did it go?</label><div class="mg">${S.mer.map((m,i)=>`<button class="mb ${F.m===m.n?'on':''}" onclick="pm(${i})"><span>${m.i}</span>${esc(m.n)}</button>`).join('')}</div>`:''}
<label>Amount (₹)</label><input id="amt" type="number" inputmode="decimal" placeholder="0" value="${F.amt}" oninput="F.amt=this.value;pv()">
<label>Date</label><input type="date" value="${F.date}" max="${T()}" onchange="F.date=this.value">
<label>Note (optional)</label><input type="text" value="${esc(F.note)}" oninput="F.note=this.value" placeholder="${ex?'e.g. chips, cab':'e.g. Papa'}">
${ex||S.bud?(ex?'':'<p class="mu">Everything above your monthly budget is saved automatically.</p>'):`<label>Move to savings?</label><div class="chips">${[0,10,20,30,50].map(n=>`<button class="${F.pct===n?'on':''}" onclick="F.pct=${n};R()">${n}%</button>`).join('')}</div><p id="pv" class="mu"></p>
<label>When do you expect the next transfer?</label><input type="date" value="${F.nx}" onchange="F.nx=this.value">`}
<button class="pri" onclick="sv()">${F.ed?'Save changes':ex?'Save expense':'Save money in'}</button>${F.ed?'<button class="sec" style="width:100%;margin-top:8px" onclick="F=nf();R()">Cancel edit</button>':''}</div>`},

rep(){const d=RV.sub==='d';return`<div class="seg"><button class="${d?'on':''}" onclick="RV.sub='d';R()">Daily</button><button class="${d?'':'on'}" onclick="RV.sub='m';R()">Monthly</button></div>`+(d?V.day():V.month())},
day(){const es=S.exp.filter(e=>e.date===RV.date),tot=sm(es),ins=S.inc.filter(e=>e.date===RV.date);
return`<div class="cd"><input type="date" value="${RV.date}" max="${T()}" onchange="RV.date=this.value;R()"><div class="row" style="margin-top:12px"><b>Total spent</b><b style="font-size:22px">${inr(tot)}</b></div>${tot?rows(grp(es,e=>e.m),tot):'<p class="mu">No expenses on this day.</p>'}</div>
<div class="cd"><b>Entries</b>${es.length?es.map(er).join(''):'<p class="mu">Nothing here.</p>'}${ins.map(ir).join('')}</div>`},
month(){const m=RV.month,y=+m.slice(0,4),mn=+m.slice(5),pm=ymd(new Date(y,mn-2,1)).slice(0,7),xs=S.exp.filter(e=>e.date.slice(0,7)===m),ps=S.exp.filter(e=>e.date.slice(0,7)===pm),tot=sm(xs),pt=sm(ps),dim=new Date(y,mn,0).getDate(),dd=Array.from({length:dim},(_,i)=>sm(xs.filter(e=>+e.date.slice(8)===i+1))),mxd=Math.max(1,...dd),cg=grp(xs,e=>mer(e.m).c);let c=0;const stops=cg.map(([n,v])=>{const s=c;c+=v/tot*100;return`${CATS[n]} ${s}% ${c}%`}).join(',');
const diff=tot-pt;
return`<div class="cd"><div class="row"><button class="ib" onclick="mv(-1)">‹</button><input type="month" value="${m}" max="${mo()}" onchange="RV.month=this.value||mo();R()"><button class="ib" onclick="mv(1)">›</button></div>

<div class="cd"><b>Growth</b><div class="dots">${rw.map(r=>`<div title="${nm(r.m)}: ${inr(r.c)}" style="height:${Math.max(4,Math.max(0,r.c)/mx*100)}%"></div>`).join('')}</div><small>Running total at the end of each month, ${nm(rw[0].m)} to ${nm(rw[rw.length-1].m)}.</small></div>
<div class="cd"><b>Month by month</b> <small>Tap a month for its full report</small>${rw.slice().reverse().map(r=>`<div class="it" style="cursor:pointer" onclick="RV.month='${r.m}';RV.sub='m';go('rep')"><div class="fl"><b>${nm(r.m)}</b><small>In ${inr(r.i)} · Spent ${inr(r.s)}${r.m<mo()?' · Budget left '+inr(Math.max(0,S.bud-r.s)):''}</small></div><div style="text-align:right"><b style="color:${r.n>=0?'var(--ok)':'var(--er)'}">${r.n>=0?'+':''}${inr(r.n)}</b><small style="display:block">Total ${inr(r.c)}</small></div></div>`).join('')}</div>
<div class="cd"><b>Goal</b><label>What are you saving for?</label><input type="text" value="${esc(g.name)}" placeholder="e.g. New phone" onchange="S.goal.name=this.value;save();R()"><label>Target (₹)</label><input type="number" inputmode="numeric" value="${g.target||''}" onchange="S.goal.target=+this.value||0;save();R()">${g.target?bar(Math.min(p,1),'var(--ac)')+`<small>${Math.round(p*100)}% of ${inr(g.target)}${p<1?' · '+inr(g.target-k.tot)+' to go':' · goal reached 🎉'}</small>`:''}</div>
<div class="cd"><b>Money received</b>${[...S.inc].sort((a,b)=>b.date.localeCompare(a.date)).map(ir).join('')||'<p class="mu">Nothing yet. Tell the bot when money arrives.</p>'}</div>`};
function mv(d){const y=+RV.month.slice(0,4),n=+RV.month.slice(5),m=ymd(new Date(y,n-1+d,1)).slice(0,7);if(m>mo())return toast('That month hasn’t started yet.');RV.month=m;R()}
function setBal(v){const n=parseFloat(v);if(isNaN(n))return toast('Enter a number.');S.open=n-(sm(S.inc)-sm(S.exp));save();R();toast('Balance set to '+inr(n)+' ✓')}
R();
</script></body></html>
